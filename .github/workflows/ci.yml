name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: healix
          POSTGRES_PASSWORD: healix
          POSTGRES_DB: healix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U healix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HEALIX_TEST_POSTGRES_URL: postgresql://healix:healix@localhost:5432/healix
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - run: pip install -e ".[dev]"

      - run: playwright install --with-deps chromium

      - run: ruff check .

      - run: ruff format --check .

      - run: mypy

      - run: pytest --cov
