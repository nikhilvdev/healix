name: Publish to PyPI
on:
  push:
    tags: ["v*"]

jobs:
  # The tag, the package version and the changelog must agree before anything is built.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: The tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          in_code=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('healix/__init__.py').read()).group(1))")
          echo "tag=$TAG pyproject=$version healix.__version__=$in_code"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match the pyproject.toml version $version"
            exit 1
          fi
          if [ "$in_code" != "$version" ]; then
            echo "::error::healix.__version__ is $in_code but pyproject.toml says $version"
            exit 1
          fi
          if ! grep -q "^## ${version//./\\.} " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for $version"
            exit 1
          fi

  # The full CI suite, on the tagged commit. A red suite stops the release.
  tests:
    uses: ./.github/workflows/ci.yml

  build:
    needs: [verify, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with: { name: dist, path: dist/ }

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/healix
    permissions:
      id-token: write # mandatory for trusted publishing — no secrets needed
    steps:
      - uses: actions/download-artifact@v8
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
