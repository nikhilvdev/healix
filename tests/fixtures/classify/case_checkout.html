<!doctype html><html><head><meta charset=utf-8><title>Pay</title><style>html,body{margin:0}body{font:14px sans-serif}nav a,footer a{margin-right:12px}.kpi-card{display:inline-block;width:200px;height:90px;border:1px solid #ccc;margin:8px}.chart{display:block;width:400px;height:200px}table{border-collapse:collapse}td,th{border:1px solid #ccc;padding:4px}</style></head><body>
<h1>Payment</h1>
<ol class="stepper"><li>Cart</li><li aria-current="step">Payment</li><li>Review</li></ol>
<form>
  <input name="cardnumber" autocomplete="cc-number" placeholder="Card number">
  <input name="exp" autocomplete="cc-exp" placeholder="MM / YY">
  <input name="cvc" autocomplete="cc-csc" placeholder="CVC">
  <button type="submit">Pay now</button>
</form>
</body></html>
